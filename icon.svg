<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with Rounded Squircle (Material 3) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 12" />
  
  <!-- Pulsing Orbit Indicators -->
  <circle cx="256" cy="76" r="10" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="436" cy="256" r="8" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="436" r="6" fill="#818cf8" />
  <circle cx="76" cy="256" r="8" fill="#a855f7" />

  <!-- Inner Hexagon Ring -->
  <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" 
           fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Central Agent Core (4-Point Diamond Star) -->
  <path d="M 256 140 Q 256 256 372 256 Q 256 256 256 372 Q 256 256 140 256 Q 256 256 256 140 Z" 
        fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Core Inner Spark -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
  <circle cx="256" cy="256" r="12" fill="#06b6d4" />
</svg>

